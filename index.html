<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTFOLIO | Pemika</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=K2D:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/app-public.js"></script>
</head>
<body>
    <!-- หน้าหลักสาธารณะ (ตามแบบ Wireframe) -->
    <div id="portfolio-main-view" class="view-section">
        <header class="center-card profile-header mb-20">
            <h1 class="portfolio-brand">PORTFOLIO</h1>
            <img src="images/my-profile.jpg" alt="รูปภาพโปรไฟล์" class="profile-avatar-square">
            <h2 class="profile-name">Pemika Kayadee</h2>
            <h2 class="profile-name">เปมิกา ค้ายาดี</h2>
            <p class="text-light profile-bio">คณะวิศวกรรมศาสตร์ | สาขาวิชาวิศวกรรมเครื่องกล</p>
            <p class="text-light profile-bio">มหาวิทยาลัยศรีปทุม</p>
        </header>

        <div id="public-lab-list" class="public-lab-list">
            <!-- รายการการ์ดปฏิบัติการแสดงตรงนี้ -->
        </div>

        <footer class="public-footer">
            <a href="admin.html" class="btn-text">Admin</a>
        </footer>
    </div>

    <!-- หน้ารายละเอียดปฏิบัติการสาธารณะ (ตามแบบ Wireframe) -->
    <div id="portfolio-detail-view" class="view-section hidden">
        <div class="muji-card detail-wireframe">
            <button type="button" id="btnBackToList" class="btn-text mb-10">← กลับไปหน้าหลัก</button>

            <div class="detail-header">
                <p id="web-top-meta" class="detail-top-meta"></p>
                <h1 id="web-title">หัวข้อปฏิบัติการ</h1>
                <p id="web-experimenter" class="detail-subtitle"></p>
                <p id="web-faculty" class="detail-subtitle"></p>
                <p id="web-advisor" class="detail-subtitle"></p>
                <p id="web-responsibility" class="detail-subtitle"></p>
            </div>
            <hr class="divider">

            <section class="detail-section">
                <h3>วัตถุประสงค์</h3>
                <ul id="web-objectives" class="detail-list"></ul>
            </section>

            <section id="web-equipments-section" class="detail-section">
                <h3>อุปกรณ์ที่ใช้</h3>
                <ul id="web-equipments" class="detail-list"></ul>
            </section>

            <section id="web-problems-section" class="detail-section">
                <h3>ปัญหาที่พบและแนวทางการแก้ไข</h3>
                <ul id="web-problems" class="detail-list"></ul>
            </section>

            <section id="web-flowchart-section" class="detail-section">
                <h3 class="text-center">ขั้นตอนการทดลอง</h3>
                <div id="web-flowchart" class="detail-flowchart mt-10"></div>
            </section>

            <section id="web-chart-section" class="detail-section hidden">
                <h3>กราฟผลการทดลอง</h3>
                <div id="web-chart" class="detail-chart-box mt-10"></div>
            </section>

            <section class="detail-section">
                <h3>สรุปผล</h3>
                <p id="web-summary" class="detail-summary-paragraph"></p>
            </section>

            <section class="detail-section">
                <div id="web-gallery" class="detail-gallery">
                    <div id="web-gallery-main" class="detail-gallery-main"></div>
                    <div id="web-gallery-thumbs" class="detail-gallery-thumbs"></div>
                </div>
            </section>
        </div>
    </div>
</body>
</html>
